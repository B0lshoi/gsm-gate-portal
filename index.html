<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GSM.Gate</title>
<style>
:root{
  --bg:#0A0A0A;--card:#141414;--border:#242424;
  --primary:#C8FF00;--primary-d:#9ECC00;
  --ok:#00CC66;--warn:#FFAA00;--err:#FF4444;
  --text:#F2F2F2;--muted:#5C5C5C;--muted2:#888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',Arial,sans-serif;
     background:var(--bg);color:var(--text);min-height:100vh;
     display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:440px;padding:0 14px 32px}

/* ── Header ── */
.hdr{width:100%;max-width:440px;background:#0D0D0D;
     border-bottom:3px solid var(--primary);padding:13px 16px;
     display:flex;align-items:center;gap:10px;
     position:sticky;top:0;z-index:20;margin-bottom:0}
.hdr-dot{width:9px;height:9px;border-radius:50%;background:#2E2E2E;
         flex-shrink:0;transition:background .4s,box-shadow .4s}
.hdr-dot.online{background:var(--ok);box-shadow:0 0 0 4px rgba(0,204,102,.18)}
.hdr-dot.stale {background:var(--warn)}
.hdr-dot.offline{background:var(--err);box-shadow:0 0 0 4px rgba(255,68,68,.15)}
.hdr-info{flex:1}
.hdr-title{font-size:17px;font-weight:700;color:var(--primary);line-height:1.2}
.hdr-sub{font-size:10px;color:var(--muted2);margin-top:2px}
.gear{background:none;border:none;color:var(--muted);font-size:20px;
      cursor:pointer;padding:6px;border-radius:8px;line-height:1;
      transition:color .15s}
.gear:hover{color:var(--text)}

/* ── Action buttons ── */
.btn-open{display:block;width:100%;padding:22px;
          background:var(--primary);color:#0A0A0A;
          border:none;border-radius:14px;font-size:24px;font-weight:800;
          cursor:pointer;font-family:inherit;transition:all .1s;
          letter-spacing:-.3px;margin:16px 0 10px}
.btn-open:active{transform:scale(.97);background:var(--primary-d)}

.row2{display:flex;gap:10px;margin-bottom:10px}
.btn-hold,.btn-close{flex:1;padding:18px 8px;
                      background:#1A1A1A;color:var(--text);
                      border:1.5px solid var(--border);border-radius:14px;
                      font-size:16px;font-weight:700;cursor:pointer;
                      font-family:inherit;transition:all .1s}
.btn-hold{border-color:rgba(255,170,0,.3)}
.btn-hold:hover{border-color:var(--warn);background:#1E1800}
.btn-close:hover{background:#222}
.btn-hold:active,.btn-close:active{transform:scale(.97)}

.btn-restart{display:block;width:100%;padding:13px;
             background:transparent;color:var(--err);
             border:1px solid rgba(255,68,68,.3);border-radius:14px;
             font-size:13px;font-weight:600;cursor:pointer;
             font-family:inherit;transition:all .1s;margin-bottom:16px}
.btn-restart:hover{background:rgba(255,68,68,.07);border-color:rgba(255,68,68,.6)}
.btn-restart:active{transform:scale(.97)}

/* ── Log card ── */
.card{background:var(--card);border:1px solid var(--border);
      border-radius:14px;overflow:hidden}
.ch{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--border);
    border-left:3px solid var(--primary)}
.log-item{display:flex;justify-content:space-between;align-items:center;
          padding:10px 14px;border-bottom:1px solid var(--border);gap:10px}
.log-item:last-child{border-bottom:none}
.log-txt{font-size:13px;flex:1}
.log-txt.ok{color:var(--ok)}.log-txt.err{color:var(--err)}
.log-time{font-size:11px;color:var(--muted);white-space:nowrap}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* ── Setup sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);
         z-index:100;display:flex;align-items:flex-end;justify-content:center;
         transition:opacity .2s}
.overlay.hidden{display:none}
.sheet{background:#141414;border-radius:20px 20px 0 0;
       padding:20px 18px 36px;width:100%;max-width:440px;
       border-top:3px solid var(--primary);
       max-height:90vh;overflow-y:auto}
.sheet-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px;
             display:flex;justify-content:space-between;align-items:center}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;
           cursor:pointer;padding:0;line-height:1}
.fl{display:block;font-size:10px;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--border);
    border-radius:8px;font-size:14px;background:#1E1E1E;
    color:var(--text);font-family:inherit;transition:border-color .15s}
.fi:focus{border-color:var(--primary);outline:none;
          box-shadow:0 0 0 3px rgba(200,255,0,.07)}
.frow2{display:flex;gap:8px}.frow2>div{flex:1}
.save-btn{display:block;width:100%;padding:14px;background:var(--primary);
          color:#0A0A0A;border:none;border-radius:10px;font-size:15px;
          font-weight:700;cursor:pointer;font-family:inherit;margin-top:16px}
.share-hint{margin-top:12px;padding:10px 12px;background:#0D0D0D;
            border-radius:8px;font-size:11px;color:var(--muted2);line-height:1.6;
            word-break:break-all}
.share-hint b{color:#A0A0A0}

/* ── Toast ── */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
       background:#1E1E1E;color:var(--text);padding:9px 20px;border-radius:20px;
       font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;
       pointer-events:none;z-index:999;white-space:nowrap;
       border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-dot" id="dot"></div>
  <div class="hdr-info">
    <div class="hdr-title" id="hdr-title">GSM.Gate</div>
    <div class="hdr-sub"  id="hdr-sub">проверка...</div>
  </div>
  <button class="gear" onclick="showSetup()" title="Настройки">⚙</button>
</div>

<!-- Main -->
<div class="wrap" id="app">
  <button class="btn-open" onclick="doCmd('open')">⚡ ОТКРЫТЬ</button>

  <div class="row2">
    <button class="btn-hold"  onclick="doCmd('hold')">⏸ ДЕРЖАТЬ</button>
    <button class="btn-close" onclick="doCmd('close')">■ ЗАКРЫТЬ</button>
  </div>

  <button class="btn-restart" onclick="doCmd('restart')">🔄 Рестарт устройства</button>

  <div class="card">
    <div class="ch">Последние действия</div>
    <div id="log-list"><div class="empty">—</div></div>
  </div>
</div>

<!-- Setup -->
<div class="overlay hidden" id="overlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">
      ⚙ Подключение
      <button class="close-btn" onclick="hideSetup()">×</button>
    </div>
    <label class="fl">URL облачной функции</label>
    <input class="fi" id="s-url" type="url" placeholder="https://functions.yandexcloud.net/...">
    <label class="fl">Бакет (Object Storage)</label>
    <input class="fi" id="s-bucket" type="text" placeholder="my-bucket">
    <div class="frow2">
      <div><label class="fl">Файл реле</label>
           <input class="fi" id="s-file" type="text" placeholder="relay.txt"></div>
      <div><label class="fl">Позиция</label>
           <input class="fi" id="s-pos" type="number" placeholder="0" min="0"></div>
    </div>
    <div class="frow2">
      <div><label class="fl">Символ подтверждения</label>
           <input class="fi" id="s-confirm" type="text" maxlength="1" placeholder="0"></div>
      <div><label class="fl">Название</label>
           <input class="fi" id="s-title" type="text" placeholder="Въезд"></div>
    </div>
    <button class="save-btn" onclick="saveSetup()">💾 Сохранить</button>
    <div class="share-hint" id="share-link" style="display:none">
      <b>Ссылка для быстрого открытия на другом устройстве:</b><br>
      <span id="share-url"></span>
    </div>
  </div>
</div>

<div id="overlay-bg" onclick="hideSetup()"
     style="display:none;position:fixed;inset:0;z-index:99"></div>

<div id="toast"></div>

<script>
/* ── Config ─────────────────────────────────────────────────────── */
const CFG_KEY = 'gsm_gate_v1';
let cfg = null, toastTid = null;

function loadCfg() {
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY)); } catch(e){}
  const p = new URLSearchParams(location.search);
  if (p.get('f')) {
    cfg = {
      functionUrl: p.get('f') || '',
      bucket:      p.get('b') || '',
      storageFile: p.get('s') || 'relay.txt',
      charPos:     parseInt(p.get('p') || '0') || 0,
      confirmChar: p.get('c') || '0',
      title:       decodeURIComponent(p.get('t') || '') || 'GSM.Gate'
    };
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    history.replaceState(null, '', location.pathname);
  }
  return !!(cfg && cfg.functionUrl && cfg.bucket);
}

function shareUrl() {
  if (!cfg) return '';
  const u = new URL(location.href);
  u.search = '';
  const p = new URLSearchParams({
    f: cfg.functionUrl,
    b: cfg.bucket,
    s: cfg.storageFile || 'relay.txt',
    p: String(cfg.charPos || 0),
    c: cfg.confirmChar || '0',
    t: cfg.title || 'GSM.Gate'
  });
  return u.toString() + '?' + p.toString();
}

/* ── Toast ─────────────────────────────────────────────────────── */
function toast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTid);
  toastTid = setTimeout(() => t.classList.remove('show'), ms);
}

/* ── Setup ──────────────────────────────────────────────────────── */
function showSetup() {
  if (cfg) {
    document.getElementById('s-url').value     = cfg.functionUrl || '';
    document.getElementById('s-bucket').value  = cfg.bucket || '';
    document.getElementById('s-file').value    = cfg.storageFile || 'relay.txt';
    document.getElementById('s-pos').value     = cfg.charPos != null ? cfg.charPos : 0;
    document.getElementById('s-confirm').value = cfg.confirmChar || '0';
    document.getElementById('s-title').value   = cfg.title || '';
    const sl = document.getElementById('share-link');
    const su = document.getElementById('share-url');
    su.textContent = shareUrl();
    sl.style.display = 'block';
  }
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('overlay-bg').style.display = 'block';
}

function hideSetup() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlay-bg').style.display = 'none';
}

function saveSetup() {
  const url = document.getElementById('s-url').value.trim();
  const bkt = document.getElementById('s-bucket').value.trim();
  if (!url || !bkt) { toast('Укажите URL функции и бакет ❌'); return; }
  cfg = {
    functionUrl: url,
    bucket:      bkt,
    storageFile: document.getElementById('s-file').value.trim()    || 'relay.txt',
    charPos:     parseInt(document.getElementById('s-pos').value)  || 0,
    confirmChar: document.getElementById('s-confirm').value.trim() || '0',
    title:       document.getElementById('s-title').value.trim()   || 'GSM.Gate'
  };
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  document.getElementById('hdr-title').textContent = cfg.title;
  document.getElementById('share-url').textContent = shareUrl();
  document.getElementById('share-link').style.display = 'block';
  toast('Сохранено ✓');
  checkHeartbeat();
}

/* ── Log ────────────────────────────────────────────────────────── */
let log = [];
try { log = JSON.parse(sessionStorage.getItem('gsm_log')) || []; } catch(e){}

function addLog(text, ok) {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()]
            .map(n => String(n).padStart(2, '0')).join(':');
  log.unshift({ t, text, ok });
  if (log.length > 10) log.pop();
  sessionStorage.setItem('gsm_log', JSON.stringify(log));
  renderLog();
}

function renderLog() {
  const el = document.getElementById('log-list');
  if (!log.length) {
    el.innerHTML = '<div class="empty">—</div>';
    return;
  }
  el.innerHTML = log.map(e =>
    `<div class="log-item">
       <span class="log-txt ${e.ok ? 'ok' : 'err'}">${e.text}</span>
       <span class="log-time">${e.t}</span>
     </div>`
  ).join('');
}

/* ── Commands ───────────────────────────────────────────────────── */
const LABELS = { open:'Открыть', hold:'Держать', close:'Закрыть', restart:'Рестарт' };

async function doCmd(action) {
  if (!cfg || !cfg.functionUrl) { showSetup(); return; }
  if (action === 'restart' && !confirm('Перезагрузить устройство?')) return;

  const vals = { open:'1', hold:'2', close: cfg.confirmChar || '0', restart:'!' };
  const val  = vals[action];

  const base = cfg.functionUrl.replace(/\/$/, '');
  const url  = base
    + '?action=write'
    + '&bucket='  + encodeURIComponent(cfg.bucket)
    + '&file='    + encodeURIComponent(cfg.storageFile || 'relay.txt')
    + '&pos='     + (cfg.charPos || 0)
    + '&value='   + encodeURIComponent(val);

  try {
    const r   = await fetch(url);
    const txt = (await r.text()).trim();
    const ok  = r.ok && txt === val;
    addLog(LABELS[action] + (ok ? ' — отправлено' : ' — ошибка: ' + txt), ok);
    toast(ok ? LABELS[action] + ' ✓' : 'Ошибка: ' + txt + ' ❌', 3000);
  } catch(e) {
    addLog(LABELS[action] + ' — нет связи', false);
    toast('Нет связи с функцией ❌', 3000);
  }
}

/* ── Heartbeat ──────────────────────────────────────────────────── */
async function checkHeartbeat() {
  const dot = document.getElementById('dot');
  const sub = document.getElementById('hdr-sub');
  if (!cfg || !cfg.functionUrl) {
    dot.className = 'hdr-dot';
    sub.textContent = 'Настройте подключение';
    return;
  }

  const url = cfg.functionUrl.replace(/\/$/, '')
    + '?action=read_file'
    + '&bucket=' + encodeURIComponent(cfg.bucket)
    + '&file=heartbeat.txt';

  try {
    const r   = await fetch(url);
    const txt = (await r.text()).trim();
    // Формат: "2026-08-06T12:34:56Z" (UTC)
    const ts  = new Date(txt.endsWith('Z') ? txt : txt + 'Z');
    const age = (Date.now() - ts.getTime()) / 1000;

    if (isNaN(age) || txt.length < 10) {
      dot.className = 'hdr-dot stale';
      sub.textContent = 'Нет данных';
    } else if (age < 180) {
      dot.className = 'hdr-dot online';
      const m = Math.floor(age / 60), s = Math.floor(age % 60);
      sub.textContent = 'Онлайн · ' + (m > 0 ? m + 'м ' + s + 'с' : s + 'с') + ' назад';
    } else if (age < 600) {
      dot.className = 'hdr-dot stale';
      sub.textContent = 'Нет данных · ' + Math.floor(age / 60) + ' мин назад';
    } else {
      dot.className = 'hdr-dot offline';
      sub.textContent = 'Офлайн · ' + Math.floor(age / 60) + ' мин назад';
    }
  } catch(e) {
    dot.className = 'hdr-dot offline';
    sub.textContent = 'Нет связи с функцией';
  }
}

/* ── Init ───────────────────────────────────────────────────────── */
renderLog();

if (loadCfg()) {
  document.getElementById('hdr-title').textContent = cfg.title || 'GSM.Gate';
  checkHeartbeat();
  setInterval(checkHeartbeat, 60000);
} else {
  document.getElementById('hdr-sub').textContent = 'Настройте подключение ↗';
  showSetup();
}
</script>
</body>
</html>
